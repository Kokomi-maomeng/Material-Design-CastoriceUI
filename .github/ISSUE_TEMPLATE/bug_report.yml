name: Bug report
description: Report a reproducible CastoriceUI defect without production secrets.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, Tokens, API Secrets, subscription URLs, private IP inventories, or raw production configuration.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v2.5.0 or full commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Frontend, Charts and interaction, Backend, Deployment, Documentation]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, Tokens, private keys, subscription URLs, and private production data.
          required: true
