name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      browser: ${{ steps.plan.outputs.browser }}
      vm: ${{ steps.plan.outputs.vm }}
      matrix: ${{ steps.plan.outputs.matrix }}
      image12: ${{ steps.plan.outputs.image12 }}
      image13: ${{ steps.plan.outputs.image13 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm run scan:sensitive
      - run: python3 -m pip install -r server/requirements.txt 'playwright==1.58.0'
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci.py plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-plan
          path: outputs/ci/plan.json
          if-no-files-found: error
          retention-days: 7

  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - name: Inspect source and full Git metadata before dependency installation
        run: npm run scan:sensitive
      - run: npm ci
      - run: python3 -m pip install -r server/requirements.txt
      - run: npm run check

  nginx-template:
    name: Nginx template (Debian ${{ matrix.debian }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        debian: ["12", "13"]
    container: debian:${{ matrix.debian }}-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate TLS template and existing-browser cache upgrade
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates nginx openssl python3
          install -d /etc/letsencrypt/live/panel.example.com /var/www/castorice-ui/current
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=panel.example.com' \
            -keyout /etc/letsencrypt/live/panel.example.com/privkey.pem \
            -out /etc/letsencrypt/live/panel.example.com/fullchain.pem
          cat > /tmp/castorice-nginx.conf <<EOF
          pid /tmp/castorice-nginx.pid;
          error_log stderr;
          events {}
          http {
              access_log off;
              include /etc/nginx/mime.types;
              include $GITHUB_WORKSPACE/deploy/nginx.conf.example;
          }
          EOF
          nginx -t -c /tmp/castorice-nginx.conf
          python3 scripts/nginx-cache-acceptance.py

  browser-matrix:
    name: Browser (${{ matrix.engine }}, ${{ matrix.suite }})
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-plan
          path: outputs/ci
      - run: npm ci
      - name: Install pinned browser runtime
        run: |
          python3 -m pip install -r server/requirements.txt 'playwright==1.58.0'
          python3 -m playwright install --with-deps '${{ matrix.engine }}'
      - name: Run relevant suite first, then remaining regressions once
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          npm run dev > /tmp/castorice-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --insecure https://127.0.0.1:5173/ >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat /tmp/castorice-vite.log; exit 1; fi
            sleep 1
          done
          python3 scripts/run-browser-suite.py '${{ matrix.engine }}' '${{ matrix.suite }}' --base "$CI_BASE"
      - name: Record actual inputs and result
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
        run: |
          status=failed
          if [ "$CHECK_STATUS" = success ]; then status=passed; fi
          python3 scripts/ci.py record --domain '${{ matrix.suite }}' --key '${{ matrix.suite }}-${{ matrix.engine }}' --status "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ci-result-${{ matrix.suite }}-${{ matrix.engine }}
          path: outputs/ci/${{ matrix.suite }}-${{ matrix.engine }}.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-detail-${{ matrix.suite }}-${{ matrix.engine }}
          path: outputs/browser/*.json
          if-no-files-found: warn
          retention-days: 7

  linux-install:
    name: Linux install (Debian ${{ matrix.debian }})
    needs: plan
    if: needs.plan.outputs.vm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        debian: ["12", "13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-plan
          path: outputs/ci
      - run: npm ci
      - run: python3 -m pip install -r server/requirements.txt 'playwright==1.58.0'
      - run: npm run release:package
      - name: Install independent VM runtime
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils
      - name: Fresh installation, rollback, retry and actual VM reboot
        env:
          EXPECTED_IMAGE: ${{ matrix.debian == '12' && needs.plan.outputs.image12 || needs.plan.outputs.image13 }}
        run: |
          panel_version=$(node --print "require('./package.json').version")
          python3 scripts/linux-vm-qa.py '${{ matrix.debian }}' "release/CastoriceUI-v${panel_version}.tar.gz" --expected-image-sha512 "$EXPECTED_IMAGE"
      - name: Record actual inputs and result
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
        run: |
          status=failed
          if [ "$CHECK_STATUS" = success ]; then status=passed; fi
          python3 scripts/ci.py record --domain vm --key 'vm-${{ matrix.debian }}' --status "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ci-result-vm-${{ matrix.debian }}
          path: outputs/ci/vm-${{ matrix.debian }}.json
          if-no-files-found: error
          retention-days: 7

  acceptance:
    name: Release acceptance
    if: always()
    needs: [plan, validate, nginx-template, browser-matrix, linux-install]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ci-plan
          path: outputs/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.browser-matrix.result != 'skipped' || needs.linux-install.result != 'skipped'
        with:
          pattern: ci-result-*
          path: outputs/ci
          merge-multiple: true
      - name: Require fresh execution or verified inherited evidence
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py merge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: castorice-ci-evidence-v1
          path: outputs/ci/manifest.json
          if-no-files-found: error
          retention-days: 7
