name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -m pip install -r server/requirements.txt
      - run: npm run check

  nginx-template:
    name: Nginx template (Debian ${{ matrix.debian }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian: ["12", "13"]
    container: debian:${{ matrix.debian }}-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the complete TLS template
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates nginx openssl
          install -d /etc/letsencrypt/live/panel.example.com /var/www/castorice-ui/current
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=panel.example.com' \
            -keyout /etc/letsencrypt/live/panel.example.com/privkey.pem \
            -out /etc/letsencrypt/live/panel.example.com/fullchain.pem
          cat > /tmp/castorice-nginx.conf <<EOF
          pid /tmp/castorice-nginx.pid;
          error_log stderr;
          events {}
          http {
              access_log off;
              include /etc/nginx/mime.types;
              include $GITHUB_WORKSPACE/deploy/nginx.conf.example;
          }
          EOF
          nginx -t -c /tmp/castorice-nginx.conf

  browser-matrix:
    name: Browser matrix (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser runtime
        run: |
          python3 -m pip install -r server/requirements.txt
          python3 -m pip install 'playwright==1.58.0'
          python3 -m playwright install --with-deps '${{ matrix.engine }}'
      - name: Run interaction and viewport matrix
        shell: bash
        run: |
          set -euo pipefail
          npm run dev > /tmp/castorice-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --insecure https://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/castorice-vite.log
              exit 1
            fi
            sleep 1
          done
          python3 scripts/browser-matrix.py '${{ matrix.engine }}'
          python3 scripts/browser-v46.py '${{ matrix.engine }}'
          python3 scripts/browser-first-run.py '${{ matrix.engine }}'

  linux-install:
    name: Linux install (Debian ${{ matrix.debian }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        debian: ["12", "13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:package
      - name: Install independent VM runtime
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils
      - name: Fresh installation, rollback, retry and actual VM reboot
        run: |
          panel_version=$(node --print "require('./package.json').version")
          python3 scripts/linux-vm-qa.py '${{ matrix.debian }}' "release/CastoriceUI-v${panel_version}.tar.gz"

  acceptance:
    name: Release acceptance
    if: always()
    needs: [validate, nginx-template, browser-matrix, linux-install]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation matrix
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["JOB_RESULTS"])
          failed = {name: item["result"] for name, item in results.items() if item["result"] != "success"}
          if failed:
              raise SystemExit(f"Acceptance failed: {failed}")
          print("All code, browser, Nginx and Linux deployment gates passed")
          PY
